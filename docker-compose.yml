services:
  solventa-db:
    image: postgres:16
    container_name: solventa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: solventa
    ports:
      - "5432:5432"
    volumes:
      - solventa-db-data:/var/lib/postgresql/data

volumes:
  solventa-db-data: